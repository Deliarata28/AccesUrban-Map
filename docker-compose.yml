services:
  database:
    image: postgis/postgis:16-3.4
    container_name: accesurbanmap-postgis
    environment:
      POSTGRES_DB: acces_urban_map
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - accesurbanmap-postgres:/var/lib/postgresql/data

volumes:
  accesurbanmap-postgres:
